<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis GCS | Ground Control</title>
    <!-- Leaflet.js CSS for Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS for Palantir-style Enterprise UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Courier New', Courier, monospace; }
        #map { height: 100%; width: 100%; border-radius: 0.5rem; filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; }
        .hud-value { color: #38bdf8; font-weight: bold; font-size: 1.25rem; }
        .status-badge { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    
    <!-- Top Navigation Bar -->
    <header class="glass-panel p-4 flex justify-between items-center z-10 border-b border-slate-700">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-red-500 status-badge" id="conn-indicator"></div>
            <h1 class="text-xl font-bold tracking-widest text-slate-200">AEGIS<span class="text-sky-400">OS</span> // GCS</h1>
        </div>
        <div class="flex gap-6 text-sm">
            <div>SYS STATUS: <span id="status-display" class="text-emerald-400">CONNECTING...</span></div>
            <div>UPTIME: <span id="uptime-display" class="text-slate-300">00:00:00</span></div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex p-4 gap-4 relative z-0">
        
        <!-- Left Panel: Telemetry HUD -->
        <aside class="w-80 glass-panel rounded-lg p-6 flex flex-col gap-6 z-10">
            <h2 class="text-sm tracking-widest text-slate-400 border-b border-slate-700 pb-2">FLIGHT TELEMETRY</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <div class="text-xs text-slate-500">ALTITUDE</div>
                    <div class="hud-value" id="alt-val">0.0 m</div>
                </div>
                <div>
                    <div class="text-xs text-slate-500">HEADING</div>
                    <div class="hud-value" id="hdg-val">000°</div>
                </div>
                <div>
                    <div class="text-xs text-slate-500">BATTERY</div>
                    <div class="hud-value" id="bat-val">100%</div>
                </div>
                <div>
                    <div class="text-xs text-slate-500">DATALINK</div>
                    <div class="hud-value text-emerald-400">SECURE</div>
                </div>
            </div>

            <h2 class="text-sm tracking-widest text-slate-400 border-b border-slate-700 pb-2 mt-4">GPS COORDINATES</h2>
            <div>
                <div class="text-xs text-slate-500">LATITUDE</div>
                <div class="text-lg text-slate-200 font-bold" id="lat-val">--.------</div>
            </div>
            <div>
                <div class="text-xs text-slate-500">LONGITUDE</div>
                <div class="text-lg text-slate-200 font-bold" id="lng-val">--.------</div>
            </div>

            <button class="mt-auto w-full bg-red-900/50 hover:bg-red-800 text-red-200 border border-red-700 py-3 rounded uppercase font-bold tracking-wider transition-colors">
                EMERGENCY RTL
            </button>
        </aside>

        <!-- Center Panel: The Live Map -->
        <section class="flex-1 rounded-lg overflow-hidden relative border border-slate-700 z-0">
            <div id="map"></div>
            <!-- Crosshair Overlay -->
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-10 opacity-30">
                <div class="w-16 h-16 border-2 border-sky-400 rounded-full flex items-center justify-center">
                    <div class="w-1 h-1 bg-sky-400 rounded-full"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- Socket.IO & Leaflet Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Initialize Map (Dark Mode)
        const map = L.map('map', {zoomControl: false}).setView([37.7749, -122.4194], 18);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Drone Marker Custom Icon (Triangle)
        const droneIcon = L.divIcon({
            html: `<div style="transform: rotate(0deg);" id="drone-icon-rotater">
                     <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 22 12 17 22 22 12 2"></polygon>
                     </svg>
                   </div>`,
            className: '',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });
        
        let droneMarker = L.marker([37.7749, -122.4194], {icon: droneIcon}).addTo(map);
        let flightPath = L.polyline([], {color: '#38bdf8', weight: 3, opacity: 0.7, dashArray: '5, 10'}).addTo(map);

        // 2. Connect to Flask WebSockets
        const socket = io();
        
        socket.on('connect', () => {
            document.getElementById('conn-indicator').classList.replace('bg-red-500', 'bg-emerald-500');
            document.getElementById('status-display').innerText = 'LINK ESTABLISHED';
        });

        socket.on('disconnect', () => {
            document.getElementById('conn-indicator').classList.replace('bg-emerald-500', 'bg-red-500');
            document.getElementById('status-display').innerText = 'DATALINK LOST';
            document.getElementById('status-display').classList.replace('text-emerald-400', 'text-red-500');
        });

        // 3. Handle incoming telemetry
        socket.on('telemetry', function(data) {
            // Update HUD text
            document.getElementById('alt-val').innerText = data.alt.toFixed(1) + ' m';
            document.getElementById('hdg-val').innerText = data.heading.toFixed(0) + '°';
            document.getElementById('bat-val').innerText = data.battery.toFixed(1) + '%';
            document.getElementById('lat-val').innerText = data.lat.toFixed(6);
            document.getElementById('lng-val').innerText = data.lng.toFixed(6);
            document.getElementById('status-display').innerText = data.status;

            // Update Map
            const newLatLng = new L.LatLng(data.lat, data.lng);
            droneMarker.setLatLng(newLatLng);
            flightPath.addLatLng(newLatLng);
            map.panTo(newLatLng, {animate: true, duration: 0.5});
            
            // Rotate icon based on heading
            const rotater = document.getElementById('drone-icon-rotater');
            if(rotater) rotater.style.transform = `rotate(${data.heading}deg)`;
        });

        // Simple Uptime Counter
        let seconds = 0;
        setInterval(() => {
            seconds++;
            const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            document.getElementById('uptime-display').innerText = `${hrs}:${mins}:${secs}`;
        }, 1000);
    </script>
</body>
</html>
